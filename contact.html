<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Da Kine Grindz by Imi</title>
    <meta name="description" content="Contact Da Kine Grindz by Imi with questions, feedback, or catering inquiries using our simple contact form.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>Da Kine Grindz by Imi</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>

    <section>
        <h2>Contact Us</h2>
        <p>If you have questions or want to reach out, fill out the form below.</p>
    </section>

    <section>
        <form>

            <fieldset>
                <legend>Your Information</legend>

                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message *</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <label for="reason">Reason for Contact</label>
                <select id="reason" name="reason">
                    <option value="">Choose one</option>
                    <option value="catering">Catering Inquiry</option>
                    <option value="feedback">Feedback</option>
                    <option value="general">General Question</option>
                </select>
            </fieldset>

            <p><em>Your information will only be used to respond to your message.</em></p>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

</main>

<footer>
    <p>© 2026 Da Kine Grindz by Imi</p>
</footer>

</body>
</html>
